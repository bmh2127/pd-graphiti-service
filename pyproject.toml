[project]
name = "pd-graphiti-service"
version = "0.1.0"
description = "Production FastAPI/Docker/Kubernetes service for hosting Parkinson's Disease knowledge graphs with monitoring and structured logging"
readme = "README.md"
authors = [
    {name = "Brandon Hager", email = "bmh2127@users.noreply.github.com"}
]
license = {text = "GPL-3.0"}
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/bmh2127/pd-graphiti-service"
Repository = "https://github.com/bmh2127/pd-graphiti-service"
dependencies = [
    "fastapi>=0.116.1",
    "graphiti-core>=0.18.2",
    "httpx>=0.28.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.6.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "python-dotenv>=1.1.1",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.35.0",
    "watchdog>=6.0.0",
    # Monitoring and logging dependencies
    "prometheus-client>=0.21.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.4.0",
    "psutil>=6.1.0",
    # Dagster Pipes for real-time communication
    "dagster-pipes>=1.8.7",
]
